services:
  postgres:
    image: postgres:17
    container_name: agentshield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentshield}

    ports:
      - "5432:5432"

    volumes:
      - agentshield_postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentshield} -d ${POSTGRES_DB:-agentshield}"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    container_name: agentshield-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"

    ports:
      - "8181:8181"

    volumes:
      - ./policies:/policies:ro

    networks:
      - backend

    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: agentshield-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

    ports:
      - "19092:19092"

    volumes:
      - agentshield_redpanda_data:/var/lib/redpanda/data

    networks:
      - backend

    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: agentshield-gateway:local
    container_name: agentshield-gateway
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agentshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentshield}
      OPA_URL: http://opa:8181
      KAFKA_BROKER: redpanda:9092
      AGENTSHIELD_ADMIN_API_KEY: ${AGENTSHIELD_ADMIN_API_KEY}
      AGENTSHIELD_ANALYST_API_KEY: ${AGENTSHIELD_ANALYST_API_KEY}
      AGENTSHIELD_CREDENTIAL_BROKER_API_KEY: ${AGENTSHIELD_CREDENTIAL_BROKER_API_KEY}

    ports:
      - "8080:8080"

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      redpanda:
        condition: service_started

  credential-broker:
    build:
      context: ./services/credential-broker
      dockerfile: Dockerfile
    image: agentshield-credential-broker:local
    container_name: agentshield-credential-broker
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m

    environment:
      AGENTSHIELD_GATEWAY_URL: http://gateway:8080
      AGENTSHIELD_CREDENTIAL_BROKER_API_KEY: ${AGENTSHIELD_CREDENTIAL_BROKER_API_KEY}
      AGENTSHIELD_CREDENTIAL_SIGNING_SECRET: ${AGENTSHIELD_CREDENTIAL_SIGNING_SECRET}

    ports:
      - "8081:8081"

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8081/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      gateway:
        condition: service_healthy

  audit:
    build:
      context: ./services/audit
      dockerfile: Dockerfile
    image: agentshield-audit:local
    container_name: agentshield-audit
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m

    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_SECURITY_TOPIC: agentshield.security.events
      KAFKA_CONSUMER_GROUP: agentshield-audit-service

    ports:
      - "8082:8082"

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8082/ready"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      redpanda:
        condition: service_started

  detection:
    build:
      context: ./services/detection
      dockerfile: Dockerfile
    image: agentshield-detection:local
    container_name: agentshield-detection
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agentshield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentshield}
      KAFKA_BROKER: redpanda:9092
      KAFKA_SECURITY_TOPIC: agentshield.security.events
      KAFKA_DLQ_TOPIC: agentshield.security.dlq
      KAFKA_CONSUMER_GROUP: agentshield-detection

    ports:
      - "8083:8083"

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8083/ready"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

volumes:
  agentshield_postgres_data:
  agentshield_redpanda_data:

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true