services:
  postgres:
    image: postgres:17
    container_name: agentshield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield_dev_password
      POSTGRES_DB: agentshield

    ports:
      - "5432:5432"

    volumes:
      - agentshield_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield -d agentshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    container_name: agentshield-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"

    ports:
      - "8181:8181"

    volumes:
      - ./policies:/policies:ro

    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: agentshield-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - agentshield_redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

volumes:
  agentshield_postgres_data:
  agentshield_redpanda_data: