apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agentshield
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentshield

spec:
  type: ClusterIP

  selector:
    app: gateway

  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agentshield
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentshield

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: gateway
          image: agentshield-gateway:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "host=postgres port=5432 user=agentshield password=$(POSTGRES_PASSWORD) dbname=agentshield sslmode=disable"

            - name: OPA_URL
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: OPA_URL

            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: KAFKA_BROKER

            - name: AGENTSHIELD_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: AGENTSHIELD_ADMIN_API_KEY

            - name: AGENTSHIELD_ANALYST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: AGENTSHIELD_ANALYST_API_KEY

            - name: AGENTSHIELD_CREDENTIAL_BROKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: AGENTSHIELD_CREDENTIAL_BROKER_API_KEY

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL