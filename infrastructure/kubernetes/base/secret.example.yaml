apiVersion: v1
kind: Secret
metadata:
  name: agentshield-secrets
  namespace: agentshield
type: Opaque
stringData:
  AGENTSHIELD_ADMIN_API_KEY: "replace-with-admin-api-key"
  AGENTSHIELD_ANALYST_API_KEY: "replace-with-analyst-api-key"
  AGENTSHIELD_CREDENTIAL_BROKER_API_KEY: "replace-with-credential-broker-api-key"
  AGENTSHIELD_CREDENTIAL_SIGNING_SECRET: "replace-with-random-signing-secret"
  POSTGRES_USER: "agentshield"
  POSTGRES_PASSWORD: "replace-with-postgres-password"