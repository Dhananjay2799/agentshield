apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: agentshield
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: agentshield
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: agentshield
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: agentshield
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: agentshield
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: agentshield
spec:
  serviceName: redpanda
  replicas: 1

  selector:
    matchLabels:
      app: redpanda

  template:
    metadata:
      labels:
        app: redpanda
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redpanda
          image: redpandadata/redpanda:latest
          imagePullPolicy: IfNotPresent

          command:
            - rpk

          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --node-id
            - "0"
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://redpanda:9092

          ports:
            - containerPort: 9092
              name: kafka

          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          readinessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-data