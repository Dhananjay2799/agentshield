---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 5432

    - from:
        - podSelector:
            matchLabels:
              app: detection
      ports:
        - protocol: TCP
          port: 5432

    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: database-migration
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa-ingress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app: opa

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8181

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-ingress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app: redpanda

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway

        - podSelector:
            matchLabels:
              app: audit

        - podSelector:
            matchLabels:
              app: detection

        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda-topics

      ports:
        - protocol: TCP
          port: 9092

---
