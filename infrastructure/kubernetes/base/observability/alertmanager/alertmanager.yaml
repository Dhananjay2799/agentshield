apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: agentshield
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: agentshield
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default-receiver
      group_by:
        - alertname
        - service
        - severity
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h

      routes:
        - matchers:
            - severity="critical"
          receiver: critical-receiver

        - matchers:
            - severity="warning"
          receiver: warning-receiver

    receivers:
      - name: default-receiver
        webhook_configs:
          - url: http://alert-receiver:8084/v1/alerts
            send_resolved: true

      - name: critical-receiver
        webhook_configs:
          - url: http://alert-receiver:8084/v1/alerts
            send_resolved: true

      - name: warning-receiver
        webhook_configs:
          - url: http://alert-receiver:8084/v1/alerts
            send_resolved: true

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: agentshield
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: agentshield
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: agentshield
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: agentshield
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"

          ports:
            - name: http
              containerPort: 9093

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true

            - name: data
              mountPath: /alertmanager

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: alertmanager-config

        - name: data
          emptyDir: {}