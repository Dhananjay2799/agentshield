apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: agentshield
  labels:
    app: alert-receiver
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/part-of: agentshield
spec:
  type: ClusterIP
  selector:
    app: alert-receiver
  ports:
    - name: http
      port: 8084
      targetPort: 8084

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: agentshield
  labels:
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/part-of: agentshield
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alert-receiver

  template:
    metadata:
      labels:
        app: alert-receiver
        app.kubernetes.io/name: alert-receiver
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alert-receiver
          image: agentshield-alert-receiver:phase30-local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8084

          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 150m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL