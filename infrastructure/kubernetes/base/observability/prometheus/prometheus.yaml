apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agentshield
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentshield
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: "gateway"
        metrics_path: /metrics
        static_configs:
          - targets:
              - gateway:8080

      - job_name: "alertmanager"
        metrics_path: /metrics
        static_configs:
          - targets:
              - alertmanager:9093

      - job_name: "credential-broker"
        metrics_path: /metrics
        static_configs:
          - targets:
              - credential-broker:8081

      - job_name: "audit"
        metrics_path: /metrics
        static_configs:
          - targets:
              - audit:8082

      - job_name: "detection"
        metrics_path: /metrics
        static_configs:
          - targets:
              - detection:8083

      - job_name: "ml-anomaly"
        metrics_path: /metrics
        static_configs:
          - targets:
              - ml-anomaly:8085

      - job_name: "opa"
        metrics_path: /metrics
        static_configs:
          - targets:
              - opa:8181

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agentshield
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentshield
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agentshield
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentshield
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"

          ports:
            - name: http
              containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true

            - name: alert-rules
              mountPath: /etc/prometheus/rules
              readOnly: true

            - name: data
              mountPath: /prometheus

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: alert-rules
          configMap:
            name: prometheus-alert-rules

        - name: data
          emptyDir: {}