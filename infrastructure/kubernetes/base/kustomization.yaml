apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml

  - postgres/postgres.yaml
  - redpanda/redpanda.yaml
  - opa/opa.yaml

  - observability/prometheus/prometheus.yaml
  - observability/grafana/grafana.yaml
  - observability/alertmanager/alertmanager.yaml
  - observability/alertmanager/alert-receiver.yaml

  - gateway/gateway.yaml
  - credential-broker/credential-broker.yaml
  - audit/audit.yaml
  - detection/detection.yaml

  - network/network-policies.yaml

  - jobs/database-migration.yaml
  - jobs/redpanda-topics.yaml

configMapGenerator:
  - name: agentshield-db-migrations
    namespace: agentshield
    files:
      - 001_initial_schema.sql=postgres/migrations/001_initial_schema.sql
      - 002_incident_lifecycle.sql=postgres/migrations/002_incident_lifecycle.sql
      - 003_agent_behavior_profiles.sql=postgres/migrations/003_agent_behavior_profiles.sql

  - name: prometheus-alert-rules
    namespace: agentshield
    files:
      - agentshield-alerts.yaml=observability/prometheus/alerts.yaml

  - name: grafana-dashboard-provider
    namespace: agentshield
    files:
      - dashboard.yaml=observability/grafana/dashboard-provider.yaml

  - name: grafana-dashboards
    namespace: agentshield
    files:
      - agentshield-security-operations.json=observability/grafana/dashboards/agentshield-security-operations.json

generatorOptions:
  disableNameSuffixHash: true