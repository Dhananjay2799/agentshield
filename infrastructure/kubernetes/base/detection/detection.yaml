apiVersion: v1
kind: Service
metadata:
  name: detection
  namespace: agentshield
  labels:
    app.kubernetes.io/name: detection
    app.kubernetes.io/part-of: agentshield

spec:
  type: ClusterIP

  selector:
    app: detection

  ports:
    - name: http
      port: 8083
      targetPort: 8083

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection
  namespace: agentshield
  labels:
    app.kubernetes.io/name: detection
    app.kubernetes.io/part-of: agentshield

spec:
  replicas: 1

  selector:
    matchLabels:
      app: detection

  template:
    metadata:
      labels:
        app: detection
        app.kubernetes.io/name: detection
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: detection
          image: agentshield-detection:phase29-observability
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8083

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "host=postgres port=5432 user=agentshield password=$(POSTGRES_PASSWORD) dbname=agentshield sslmode=disable"

            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: KAFKA_BROKER

            - name: KAFKA_SECURITY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: KAFKA_SECURITY_TOPIC

            - name: KAFKA_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: KAFKA_DLQ_TOPIC

            - name: KAFKA_CONSUMER_GROUP
              value: "agentshield-detection"

          startupProbe:
            httpGet:
              path: /ready
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL