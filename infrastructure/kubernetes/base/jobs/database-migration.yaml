apiVersion: batch/v1
kind: Job
metadata:
  name: agentshield-database-migration
  namespace: agentshield
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/part-of: agentshield

spec:
  backoffLimit: 10

  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
        app.kubernetes.io/part-of: agentshield

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: postgres:17

          env:
            - name: PGHOST
              value: postgres

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              value: agentshield

            - name: PGUSER
              value: agentshield

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: POSTGRES_PASSWORD

          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h "${PGHOST}" \
                -p "${PGPORT}" \
                -U "${PGUSER}" \
                -d "${PGDATABASE}"
              do
                sleep 2
              done

              echo "PostgreSQL is ready."
              echo "Applying AgentShield database migrations..."

              psql \
                -h "${PGHOST}" \
                -p "${PGPORT}" \
                -U "${PGUSER}" \
                -d "${PGDATABASE}" \
                -v ON_ERROR_STOP=1 \
                -f /migrations/001_initial_schema.sql \
                -f /migrations/002_incident_lifecycle.sql \
                -f /migrations/003_agent_behavior_profiles.sql

              echo "AgentShield database migrations completed."

          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: migrations
          configMap:
            name: agentshield-db-migrations