apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: agentshield
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/part-of: agentshield
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: agentshield
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/part-of: agentshield
spec:
  replicas: 1

  selector:
    matchLabels:
      app: opa

  template:
    metadata:
      labels:
        app: opa
        app.kubernetes.io/name: opa
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: opa
          image: openpolicyagent/opa:latest
          imagePullPolicy: IfNotPresent

          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - /policies/agentshield.rego

          ports:
            - containerPort: 8181
              name: http

          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: policies
          configMap:
            name: opa-policies