apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: detection-ml-anomaly-egress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app: detection

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ml-anomaly

      ports:
        - protocol: TCP
          port: 8085

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-anomaly-ingress
  namespace: agentshield
spec:
  podSelector:
    matchLabels:
      app: ml-anomaly

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: detection
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8085