apiVersion: v1
kind: Service
metadata:
  name: ml-anomaly
  namespace: agentshield
  labels:
    app: ml-anomaly
    app.kubernetes.io/name: ml-anomaly
    app.kubernetes.io/part-of: agentshield
spec:
  selector:
    app: ml-anomaly
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-anomaly
  namespace: agentshield
  labels:
    app: ml-anomaly
    app.kubernetes.io/name: ml-anomaly
    app.kubernetes.io/part-of: agentshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-anomaly
  template:
    metadata:
      labels:
        app: ml-anomaly
        app.kubernetes.io/name: ml-anomaly
        app.kubernetes.io/part-of: agentshield
    spec:
      containers:
        - name: ml-anomaly
          image: agentshield-ml-anomaly:phase36-drift
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8085

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /ready
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL