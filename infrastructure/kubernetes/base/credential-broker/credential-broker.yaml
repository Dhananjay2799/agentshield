apiVersion: v1
kind: Service
metadata:
  name: credential-broker
  namespace: agentshield
  labels:
    app.kubernetes.io/name: credential-broker
    app.kubernetes.io/part-of: agentshield

spec:
  type: ClusterIP

  selector:
    app: credential-broker

  ports:
    - name: http
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-broker
  namespace: agentshield
  labels:
    app.kubernetes.io/name: credential-broker
    app.kubernetes.io/part-of: agentshield

spec:
  replicas: 1

  selector:
    matchLabels:
      app: credential-broker

  template:
    metadata:
      labels:
        app: credential-broker
        app.kubernetes.io/name: credential-broker
        app.kubernetes.io/part-of: agentshield

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: credential-broker
          image: agentshield-credential-broker:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: AGENTSHIELD_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: agentshield-config
                  key: AGENTSHIELD_GATEWAY_URL

            - name: AGENTSHIELD_CREDENTIAL_BROKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: AGENTSHIELD_CREDENTIAL_BROKER_API_KEY

            - name: AGENTSHIELD_CREDENTIAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentshield-secrets
                  key: AGENTSHIELD_CREDENTIAL_SIGNING_SECRET

          startupProbe:
            httpGet:
              path: /health
              port: 8081

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8081

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8081

            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false

            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999

            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL